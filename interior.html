    <script src="js/script.js"></script>
    <script>
      document.addEventListener("click", function (e) {
        const clickX = e.clientX;
        const screenWidth = window.innerWidth;
        if (clickX < screenWidth * 0.2) {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    </script>
