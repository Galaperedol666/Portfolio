  <script>
  document.addEventListener('click', function(e) {
    const clickX = e.clientX;
    const screenWidth = window.innerWidth;

    // Якщо клік був у лівій 20% області
    if (clickX < screenWidth * 0.2) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
</script>
